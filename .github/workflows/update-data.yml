name: Actualizar datos y sitio

on:
  schedule:
    - cron: "0 7 * * *" # todos los días 07:00 UTC (04:00 Buenos Aires)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Bajar votaciones nuevas
        run: python scraper.py

      - name: Generar sitio
        run: python generate_site.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Actualización automática de datos $(date -u +%F)"
          git push
